# mlx と pyobjc は Apple Silicon の macOS でしか入らないので、どちらのジョブも macOS で回す
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # editable install でも pyproject の force-include が studio/dist を要求する。
      # このジョブは studio をビルドしないので、空のディレクトリで足りる
      - run: mkdir -p studio/dist
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  # 状態遷移と純関数の性質は、テストでなく verify/specs の事後条件を CrossHair で網羅して確かめる。
  # 数分かかるので、テストと lint を待たせないよう別のジョブにする
  python-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: mkdir -p studio/dist
      - run: uv sync --locked
      - run: uv run python verify/check.py

  studio:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 自前の Node 16 を PATH の先頭に入れるので、setup-node より前に置いて上書きさせる
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1.9.1
        with:
          dafny-version: "4.11.0"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # 状態遷移と純関数の性質は、//@ の注釈を LemmaScript が Dafny に写して証明する
      - run: pnpm verify
      # 生成した Dafny（verify/）が TS の今の注釈から作り直したものと一致するか
      - run: git diff --exit-code -- verify
