# v* のタグを push すると、studio をビルドしてから wheel と sdist を作り、PyPI に公開する。
# PyPI 側には Trusted Publishing（matzkoh/pairvoice・release.yml・environment pypi）を登録してあり、
# トークンは置かない
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      # タグと pyproject の版がずれたまま公開すると、PyPI の版は取り消せない
      - name: タグと版がそろっているか確かめる
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "タグ $GITHUB_REF_NAME と pyproject の版 $version が違う" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
        working-directory: studio
      - run: pnpm build
        working-directory: studio
      - run: uv build
      - run: uv publish
