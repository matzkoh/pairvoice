# v* のタグを push すると、studio をビルドしてから wheel と sdist を作り、PyPI に公開して、
# GitHub Releases にリリースノート（scripts/release-notes.sh）を載せる。
# PyPI 側には Trusted Publishing（matzkoh/pairvoice・release.yml・environment pypi）を登録してあり、
# トークンは置かない
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: studio/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      # タグと pyproject のバージョンがずれたまま公開すると、PyPI に出したものは取り消せない
      - name: タグとバージョンがそろっているか確かめる
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "タグ $GITHUB_REF_NAME と pyproject のバージョン $version が違う" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
        working-directory: studio
      - run: pnpm build
        working-directory: studio
      - run: uv build
      - run: uv publish

  # PyPI に出してから、GitHub Releases にリリースノートを載せる（メニューバーの「変更点を見る」が開く）
  notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 前のタグからの履歴が要る
          fetch-depth: 0
      - run: scripts/release-notes.sh "$GITHUB_REF_NAME" | gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file -
        env:
          GH_TOKEN: ${{ github.token }}
